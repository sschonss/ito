name: Testes end-to-end

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Instalar Playwright e Chromium
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Checar sintaxe dos scripts
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js

      - name: Rodar testes end-to-end
        run: python -m unittest discover -s tests/e2e -t tests/e2e -v

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: tests/e2e/artifacts/
          retention-days: 7
