name: Conexão real

# Testa a conexão de verdade entre dois celulares (redes Nostr e MQTT públicas).
# Roda todo dia e pelo botão "Run workflow"; não bloqueia os outros testes porque
# depende de servidores de fora.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Instalar Playwright e Chromium
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Conexão de verdade
        env:
          ITO_REAL_P2P: '1'
        run: python -m unittest test_real_p2p -v
        working-directory: tests/e2e

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-conexao-real
          path: tests/e2e/artifacts/
          retention-days: 7
